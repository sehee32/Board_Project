<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${board != null ? '게시글 수정' : '게시글 작성'}">게시글 작성</title>
    <style>
        body {
            font-family: 'Noto Sans KR', Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        .container {
            max-width: 800px;
            margin: 40px auto;
            background-color: white;
            padding: 30px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            border-radius: 5px;
            margin-top: 120px;
        }
        h2 {
            margin-bottom: 30px;
            color: #333;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="text"], textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #eaeaea;
            border-radius: 4px;
            box-sizing: border-box;
            font-family: 'Noto Sans KR', Arial, sans-serif;
            font-size: 14px;
        }
        textarea {
            min-height: 300px;
            resize: vertical;
        }
        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 30px;
            justify-content: flex-end;
        }
        button, .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            text-decoration: none;
            display: inline-block;
            transition: background-color 0.2s ease;
        }
        .btn-primary {
            background-color: #c81d25;
            color: white;
        }
        .btn-primary:hover {
            background-color: #a01a20;
        }
        .btn-secondary {
            background-color: #6c757d;
            color: white;
        }
        .btn-secondary:hover {
            background-color: #545b62;
        }
    </style>
</head>
<body>
<div th:replace="fragments/header :: header"></div>

<div class="container">
    <h2 th:text="${board != null ? '게시글 수정' : '게시글 작성'}">게시글 작성</h2>

    <form th:action="${board != null ? '/boards/' + board.id + '/edit' : '/boards/new'}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div class="form-group">
            <label for="title">제목</label>
            <input type="text" id="title" name="title" th:value="${board?.title}" required>
        </div>

        <div class="form-group">
            <label for="content">내용</label>
            <textarea id="content" name="content" required th:text="${board?.content}"></textarea>
        </div>

        <div class="buttons">
            <button type="submit" class="btn btn-primary">
                <span th:text="${board != null ? '수정' : '작성'}">작성</span>
            </button>
            <a th:href="@{/boards}" class="btn btn-secondary">취소</a>
        </div>
    </form>
</div>
</body>
</html>
