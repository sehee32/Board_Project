<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title th:text="${board.title}">게시글 상세</title>
    <style>
        body {
            font-family: 'Noto Sans', 'Pretendard', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            );
            color: #333;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            background-color: #fff;
            padding: 30px 40px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
            border-radius: 10px;
            margin-top: 120px;
        }

        .board-header {
            border-bottom: 2px solid #c81d25;
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        .board-title {
            font-size: 26px;
            margin: 0 0 8px 0;
            font-weight: 600;
            color: #333;
        }

        .board-meta {
            color: #555;
            font-size: 14px;
        }

        .board-content {
            min-height: 200px;
            padding: 20px 0;
            line-height: 1.7;
            white-space: pre-wrap;
        }

        .board-actions {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-top: 25px;
                padding-top: 20px;
                border-top: 1px solid #ddd;
        }
        .actions-left, .actions-right {
            flex: 1;
        }

        .actions-center {
            display: flex;
            gap: 10px;
        }

        .actions-right {
            text-align: right;
        }
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background-color: #c81d25; color: white;
        }
        .btn-primary:hover {
            background-color: #a2161e;
        }

        .btn-danger {
            background-color: #dc3545;
            color: white;
        }
        .btn-danger:hover {
            opacity: 0.9;
        }

        .btn-secondary {
            background-color: #eaeaea;
            color: #333;
        }
        .btn-secondary:hover {
            background-color: #d6d6d6;
        }

        .btn-success {
            background-color: #c81d25;
            color: white;
        }
        .btn-success:hover {
            background-color: #a2161e;
        }

        .like-section {
            text-align: center;
            padding: 25px 0;
            border-top: 1px solid #ddd;
            border-bottom: 1px solid #ddd;
            margin: 25px 0;
        }

        .like-btn {
            font-size: 22px;
            padding: 10px 25px;
            border: 2px solid #c81d25;
            background-color: white;
            cursor: pointer;
            border-radius: 50px;
            transition: all 0.3s ease;
            color: #c81d25;
        }

        .like-btn:hover {
            background-color: #c81d25;
            color: white;
        }

        .like-btn.liked {
            background-color: #c81d25;
            color: white;
        }

        .like-count {
            font-size: 16px;
            margin-top: 10px;
        }

        .comments-section {
            margin-top: 40px;
        }

        .comment-form {
            margin-bottom: 30px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .comment-form textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            min-height: 80px;
            box-sizing: border-box;
            font-family: inherit;
        }

        .comment-item {
            padding: 15px 20px;
            border-bottom: 1px solid #eee;
            margin-bottom: 10px;
            border-radius: 6px;
            background: #fff;
        }

        .comment-item.reply {
            margin-left: 40px;
            background-color: #f9f9f9;
            border-left: 3px solid #c81d25;
        }

        .comment-author {
            font-weight: 600;
            margin-bottom: 5px;
            color: #c81d25;
        }

        .comment-content {
            margin: 10px 0;
            line-height: 1.6;
        }

        .comment-edit-area {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            min-height: 60px;
            box-sizing: border-box;
            display: none;
            margin: 10px 0;
        }

        .comment-actions {
            font-size: 12px;
            color: #666;
        }

        .comment-actions button {
            background: none;
            border: none;
            color: #c81d25;
            cursor: pointer;
            padding: 0;
            margin-right: 10px;
            font-weight: 500;
        }

        .comment-actions button:hover {
            text-decoration: underline;
        }

        .reply-form, .edit-buttons {
            display: none;
            margin-top: 10px;
        }

        .reply-form textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 6px;
            min-height: 60px;
            box-sizing: border-box;
            font-family: inherit;
        }

        h3 {
            color: #333;
            border-left: 4px solid #c81d25;
            padding-left: 10px;
            font-size: 18px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
<div th:replace="fragments/header :: header"></div>

<div class="container">
    <div class="board-header">
        <h1 class="board-title" th:text="${board.title}">게시글 제목</h1>
        <div class="board-meta">
            작성자: <span th:text="${board.writer.username}">작성자</span> |
            좋아요: <span id="likeCountDisplay" th:text="${board.likeCount}">0</span>
        </div>
    </div>

    <div class="board-content" th:text="${board.content}">게시글 내용</div>

    <div class="like-section" sec:authorize="isAuthenticated()">
        <button class="like-btn"
                th:classappend="${liked} ? 'liked'"
                th:attr="data-board-id=${board.id}"
                onclick="toggleLike(this)">
            👍🏻LIKE
        </button>
        <div class="like-count">
            <span id="likeCount" th:text="${board.likeCount}">0</span>명이 좋아합니다
        </div>
    </div>

    <div class="board-actions">
        <div class="actions-left"></div>

        <div class="actions-center">
            <a th:href="@{/boards}" class="btn btn-secondary">목록</a>
            <a th:if="${currentUser != null && board.writer.id == currentUser.id}"
               sec:authorize="isAuthenticated()"
               th:href="@{'/boards/' + ${board.id} + '/edit'}"
               class="btn btn-primary">수정</a>
        </div>

        <div class="actions-right">
            <form th:if="${currentUser != null && board.writer.id == currentUser.id}"
                  sec:authorize="isAuthenticated()"
                  th:action="@{'/boards/' + ${board.id} + '/delete'}" method="post" style="display: inline;">
                <button type="submit" class="btn btn-danger"
                        onclick="return confirm('정말 삭제하시겠습니까?')">삭제</button>
            </form>
        </div>
    </div>

    <div class="comments-section">
        <h3>댓글 <span th:text="${#lists.size(comments)}">0</span>개</h3>

        <div class="comment-form" sec:authorize="isAuthenticated()">
            <textarea id="commentContent" placeholder="댓글을 입력하세요"></textarea>
            <button class="btn btn-primary" style="margin-top: 10px;"
                    th:attr="data-board-id=${board.id}"
                    onclick="submitComment(this, null)">댓글 작성</button>
        </div>

        <div id="commentsList">
            <div th:each="comment : ${comments}">
                <!-- 최상위 댓글 -->
                <div class="comment-item">
                    <div class="comment-author" th:text="${comment.writer.username}">작성자</div>
                    <div class="comment-content" th:text="${comment.content}">댓글 내용</div>
                    <textarea class="comment-edit-area" th:attr="data-comment-id=${comment.id}"></textarea>

                    <div class="comment-actions">
                            <span sec:authorize="isAuthenticated()">
                                <button onclick="showReplyForm(this)"
                                        th:attr="data-comment-id=${comment.id}">답글</button>
                                <span th:if="${currentUser != null && comment.writer.id == currentUser.id}">
                                    <button onclick="showEditForm(this)"
                                            th:attr="data-comment-id=${comment.id}"
                                            class="edit-btn">수정</button>
                                    <button onclick="deleteComment(this)"
                                            th:attr="data-comment-id=${comment.id}">삭제</button>
                                </span>
                            </span>
                    </div>

                    <div class="edit-buttons">
                        <button class="btn btn-success" style="margin-right: 5px;"
                                onclick="updateComment(this)"
                                th:attr="data-comment-id=${comment.id}">수정 완료</button>
                        <button class="btn btn-secondary"
                                onclick="cancelEdit(this)">취소</button>
                    </div>

                    <div class="reply-form">
                        <textarea placeholder="답글을 입력하세요"></textarea>
                        <button class="btn btn-success" style="margin-top: 5px;"
                                th:attr="data-board-id=${board.id}, data-parent-id=${comment.id}"
                                onclick="submitComment(this, this.dataset.parentId)">답글 작성</button>
                        <button class="btn btn-secondary" style="margin-top: 5px;"
                                onclick="hideReplyForm(this)">취소</button>
                    </div>
                </div>

                <!-- 대댓글들 -->
                <div th:if="${!#lists.isEmpty(comment.children)}" th:each="reply : ${comment.children}">
                    <div class="comment-item reply">
                        <div class="comment-author" th:text="${reply.writer.username}">작성자</div>
                        <div class="comment-content" th:text="${reply.content}">대댓글 내용</div>
                        <textarea class="comment-edit-area" th:attr="data-comment-id=${reply.id}"></textarea>

                        <div class="comment-actions">
                                <span sec:authorize="isAuthenticated()">
                                    <button onclick="showReplyForm(this)"
                                            th:attr="data-comment-id=${reply.id}">답글</button>
                                    <span th:if="${currentUser != null && reply.writer.id == currentUser.id}">
                                        <button onclick="showEditForm(this)"
                                                th:attr="data-comment-id=${reply.id}"
                                                class="edit-btn">수정</button>
                                        <button onclick="deleteComment(this)"
                                                th:attr="data-comment-id=${reply.id}">삭제</button>
                                    </span>
                                </span>
                        </div>

                        <div class="edit-buttons">
                            <button class="btn btn-success" style="margin-right: 5px;"
                                    onclick="updateComment(this)"
                                    th:attr="data-comment-id=${reply.id}">수정 완료</button>
                            <button class="btn btn-secondary"
                                    onclick="cancelEdit(this)">취소</button>
                        </div>

                        <div class="reply-form">
                            <textarea placeholder="답글을 입력하세요"></textarea>
                            <button class="btn btn-success" style="margin-top: 5px;"
                                    th:attr="data-board-id=${board.id}, data-parent-id=${reply.id}"
                                    onclick="submitComment(this, this.dataset.parentId)">답글 작성</button>
                            <button class="btn btn-secondary" style="margin-top: 5px;"
                                    onclick="hideReplyForm(this)">취소</button>
                        </div>
                    </div>

                    <!-- 대대댓글들 -->
                    <div th:if="${!#lists.isEmpty(reply.children)}" th:each="subReply : ${reply.children}">
                        <div class="comment-item reply" style="margin-left: 80px;">
                            <div class="comment-author" th:text="${subReply.writer.username}">작성자</div>
                            <div class="comment-content" th:text="${subReply.content}">대대댓글 내용</div>
                            <textarea class="comment-edit-area" th:attr="data-comment-id=${subReply.id}"></textarea>

                            <div class="comment-actions">
                                    <span sec:authorize="isAuthenticated()">
                                        <span th:if="${currentUser != null && subReply.writer.id == currentUser.id}">
                                            <button onclick="showEditForm(this)"
                                                    th:attr="data-comment-id=${subReply.id}"
                                                    class="edit-btn">수정</button>
                                            <button onclick="deleteComment(this)"
                                                    th:attr="data-comment-id=${subReply.id}">삭제</button>
                                        </span>
                                    </span>
                            </div>

                            <div class="edit-buttons">
                                <button class="btn btn-success" style="margin-right: 5px;"
                                        onclick="updateComment(this)"
                                        th:attr="data-comment-id=${subReply.id}">수정 완료</button>
                                <button class="btn btn-secondary"
                                        onclick="cancelEdit(this)">취소</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script th:inline="javascript">
    const boardId = [[${board.id}]];
    const csrfToken = document.querySelector('meta[name="_csrf"]').getAttribute('content');
    const csrfHeader = document.querySelector('meta[name="_csrf_header"]').getAttribute('content');


    function toggleLike(button) {
        fetch(`/api/boards/${boardId}/like`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                    [csrfHeader]: csrfToken
            }
        })
            .then(() => location.reload())
            .catch(error => {
                console.error('Error:', error);
                alert('좋아요 처리 중 오류가 발생했습니다.');
            });
    }

    function submitComment(button, parentId) {
        const textarea = parentId
            ? button.parentElement.querySelector('textarea')
            : document.getElementById('commentContent');
        const content = textarea.value.trim();

        if (!content) {
            alert('댓글 내용을 입력해주세요.');
            return;
        }

        const formData = new FormData();
        formData.append('boardId', boardId);
        formData.append('content', content);
        if (parentId) {
            formData.append('parentId', parentId);
        }

        fetch('/api/comments', {
            method: 'POST',
            headers: {
                [csrfHeader]: csrfToken
            },
            body: formData
        })
            .then(response => {
                if (response.ok) {
                    alert('댓글이 작성되었습니다.');
                    location.reload();
                } else {
                    alert('댓글 작성에 실패했습니다.');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('댓글 작성 중 오류가 발생했습니다.');
            });
    }

    function showEditForm(button) {
        const commentItem = button.closest('.comment-item');
        const contentDiv = commentItem.querySelector('.comment-content');
        const editArea = commentItem.querySelector('.comment-edit-area');
        const editButtons = commentItem.querySelector('.edit-buttons');
        const editBtn = commentItem.querySelector('.edit-btn');

        editArea.value = contentDiv.textContent;
        contentDiv.style.display = 'none';
        editArea.style.display = 'block';
        editButtons.style.display = 'block';
        editBtn.style.display = 'none';
    }

    function cancelEdit(button) {
        const commentItem = button.closest('.comment-item');
        const contentDiv = commentItem.querySelector('.comment-content');
        const editArea = commentItem.querySelector('.comment-edit-area');
        const editButtons = commentItem.querySelector('.edit-buttons');
        const editBtn = commentItem.querySelector('.edit-btn');

        contentDiv.style.display = 'block';
        editArea.style.display = 'none';
        editButtons.style.display = 'none';
        editBtn.style.display = 'inline';
    }

    function updateComment(button) {
        const commentId = button.dataset.commentId;
        const commentItem = button.closest('.comment-item');
        const editArea = commentItem.querySelector('.comment-edit-area');
        const content = editArea.value.trim();

        if (!content) {
            alert('댓글 내용을 입력해주세요.');
            return;
        }

        const formData = new FormData();
        formData.append('content', content);

        fetch(`/api/comments/${commentId}`, {
            method: 'PUT',
            headers: {
                [csrfHeader]: csrfToken
            },
            body: formData
        })
            .then(response => {
                if (response.ok) {
                    alert('댓글이 수정되었습니다.');
                    location.reload();
                } else {
                    alert('댓글 수정에 실패했습니다.');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('댓글 수정 중 오류가 발생했습니다.');
            });
    }

    function deleteComment(button) {
        if (!confirm('댓글을 삭제하시겠습니까?')) return;

        const commentId = button.dataset.commentId;

        fetch(`/api/comments/${commentId}`, {
            method: 'DELETE',
            headers: {
                [csrfHeader]: csrfToken
            }
        })
            .then(response => {
                if (response.ok) {
                    alert('댓글이 삭제되었습니다.');
                    location.reload();
                } else {
                    alert('댓글 삭제에 실패했습니다.');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('댓글 삭제 중 오류가 발생했습니다.');
            });
    }

    function showReplyForm(button) {
        const commentItem = button.closest('.comment-item');
        const replyForm = commentItem.querySelector('.reply-form');
        replyForm.style.display = replyForm.style.display === 'none' ? 'block' : 'none';
    }

    function hideReplyForm(button) {
        const replyForm = button.closest('.reply-form');
        replyForm.style.display = 'none';
    }
</script>
</body>
</html>
